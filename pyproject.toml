# Projet Python du pipeline de données (collecte, puis extraction). Le reste du dépôt est en
# TypeScript (package.json). Environnement géré par uv, Python épinglé en 3.12 (décision du
# 2026-09-22) ; uv.lock est commité et `uv sync --frozen` le rejoue à l'identique.
#
# Une seule dépendance d'exécution, épinglée : pymupdf (décision D2), pour le texte canonique des
# PDF (sous-lot C2). Sa version entre dans chaque fiche d'extraction : la changer peut changer les
# textes, donc les offsets (docs/CONTRATS.md §1.1). Le reste de la collecte n'utilise que la
# bibliothèque standard. Dépendances de développement autorisées : pytest et ruff, épinglés.
[project]
name = "banc-essai-2027-pipeline"
version = "0.0.0"
description = "Pipeline de collecte du Banc d'essai 2027"
requires-python = "==3.12.*"
dependencies = [
    "pymupdf==1.28.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "--strict-markers"]

# C901 (McCabe) à 9 au plus, équivalent de la règle ESLint `complexity` côté TypeScript
# (CLAUDE.md, « Complexité sous les seuils ») ; F (pyflakes : nom inconnu, import ou variable
# morte) et B (bugbear : pièges du langage), qui attrapent des défauts et non du style (décision D9
# du 2026-09-23). Pas de formateur.
[tool.ruff.lint]
select = ["C901", "F", "B"]

[tool.ruff.lint.mccabe]
max-complexity = 9
